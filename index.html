<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Urbanist:wght@100..900&display=swap" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>CareConnect</title>
    <!-- Apply the theme before first paint, so dark mode never flashes white on load.
         Reads the same key as src/lib/theme.ts; falls back to the OS setting. -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("careconnect-theme");
          var dark = saved ? saved === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
          if (dark) document.documentElement.classList.add("dark");
          document.documentElement.style.colorScheme = dark ? "dark" : "light";
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
